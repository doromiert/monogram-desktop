[package]
name = "monogram-desktop"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native GTK/libadwaita Monogram client"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.41"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
tokio-xmpp = "=6.0.0"
sasl = "0.5"
futures-util = { version = "0.3", features = ["sink"] }
glow = "0.18"
libloading = "0.8"
glam = "0.32"
qrcode = { version = "0.14", default-features = false }
flate2 = "1"
zip = { version = "=9.5.1", default-features = false }
openssl = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
crypto_box = "=0.9.1"
blake2 = "0.10"
percent-encoding = "2"
curve25519-dalek = "4"
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
pq_signal = { package = "libsignal-protocol", git = "https://codeberg.org/monocles/pq-omemo-2.git", rev = "10861bff671740174f4e99f7e30dc492fcf6ec8b", features = ["mlkem1024"] }
async-trait = "0.1"
rand = "=0.9.4"
tiny-keccak = { version = "=2.0.2", features = ["kmac"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"

[patch.crates-io]
# Bounded tokens for mobile invitation passwords; see vendor/tokio-xmpp/MONOGRAM-NOTICE.md.
tokio-xmpp = { path = "vendor/tokio-xmpp" }
# Match the protocol backend's pinned Signal curve implementation.
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
